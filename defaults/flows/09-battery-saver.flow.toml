# This is an Omarchist flow: https://omarchist.com/flows/

format = 2
name = "Battery saver"
description = "The power-saver profile, a dimmer screen, and the keyboard backlight off."
icon = "leaf"
on_error = "continue"

[meta]
author = "Omarchist"

[[step]]
type = "action"
action = "power.profile"
profile = "power-saver"

[[step]]
type = "action"
action = "brightness.set"
level = 40

[[step]]
type = "exec"
command = "omarchy-brightness-keyboard --no-osd off"
wait = true

[[step]]
type = "notify"
title = "Battery saver"
body = "Power saver on, screen dimmed"
