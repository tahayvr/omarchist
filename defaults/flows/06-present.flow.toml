# This is an Omarchist flow: https://omarchist.com/flows/

format = 1
name = "Present"
description = "A clean screen to share: no bar, no notifications, no screensaver, on an empty workspace."
icon = "monitor"
on_error = "continue"

[meta]
author = "Omarchist"

[[step]]
type = "exec"
command = "omarchy-shell notifications setDnd on && omarchy-shell -q omarchy.indicators refresh"
wait = true

[[step]]
type = "exec"
command = "omarchy-toggle-idle stay-awake"
wait = true

[[step]]
type = "exec"
command = "omarchy-toggle screensaver-off on"
wait = true

[[step]]
type = "exec"
command = "omarchy-toggle-bar off"
wait = true

[[step]]
type = "lua"
expr = 'hl.dsp.focus({ workspace = "empty" })'
