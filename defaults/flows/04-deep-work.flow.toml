# This is an Omarchist flow: https://omarchist.com/flows/

format = 2
name = "Deep work"
description = "Twenty-five minutes with notifications silenced, then a five-minute break."
icon = "clock"
on_error = "continue"

[meta]
author = "Omarchist"

[[step]]
type = "notify"
title = "Deep work"
body = "25 minutes, go"

[[step]]
type = "action"
action = "dnd.set"
state = "on"

[[step]]
type = "wait"
ms = 1500000

[[step]]
type = "action"
action = "dnd.set"
state = "off"

[[step]]
type = "notify"
title = "Take a five"
body = "Stand up and stretch"

[[step]]
type = "wait"
ms = 300000

[[step]]
type = "notify"
title = "Break's over"
body = "Run Deep work again for another round"
