# This is an Omarchist flow: https://omarchist.com/flows/

format = 2
name = "Meeting"
description = "Unmutes your mic, keeps the screen awake, silences notifications, and opens Google Meet."
icon = "video"
on_error = "continue"

[meta]
author = "Omarchist"

[[step]]
type = "action"
action = "mic.mute"
state = "off"

[[step]]
type = "action"
action = "awake.set"
state = "on"

[[step]]
type = "action"
action = "dnd.set"
state = "on"

[[step]]
type = "exec"
command = 'omarchy-launch-webapp "https://meet.google.com"'
