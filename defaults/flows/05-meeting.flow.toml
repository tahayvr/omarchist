# This is an Omarchist flow: https://omarchist.com/flows/

format = 1
name = "Meeting"
description = "Unmutes your mic, keeps the screen awake, silences notifications, and opens Google Meet."
icon = "video"
on_error = "continue"

[meta]
author = "Omarchist"

[[step]]
type = "exec"
command = "wpctl set-mute @DEFAULT_AUDIO_SOURCE@ 0"
wait = true

[[step]]
type = "exec"
command = "omarchy-toggle-idle stay-awake"
wait = true

[[step]]
type = "exec"
command = "omarchy-shell notifications setDnd on && omarchy-shell -q omarchy.indicators refresh"
wait = true

[[step]]
type = "exec"
command = 'omarchy-launch-webapp "https://meet.google.com"'
