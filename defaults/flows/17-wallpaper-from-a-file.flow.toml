# This is an Omarchist flow: https://omarchist.com/flows/

format = 2
name = "Wallpaper from a file"
description = "Sets a picture as your wallpaper: the file you start it on, or one you pick."
icon = "palette"
on_error = "stop"

[meta]
author = "Omarchist"

[[step]]
type = "if"
check = "empty"
value = "{{input}}"

[[step.then]]
type = "pick"
prompt = "Pick a wallpaper"
output = "picture"

[[step.then]]
type = "exec"
command = "omarchy-theme-bg-set {{picture}}"
wait = true

[[step.then]]
type = "stop"

[[step]]
type = "exec"
command = "omarchy-theme-bg-set {{input}}"
wait = true
