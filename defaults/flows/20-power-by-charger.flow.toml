# This is an Omarchist flow: https://omarchist.com/flows/

format = 2
name = "Power by charger"
description = "On battery: the power-saver profile and a dimmer screen. Plugged in: balanced and bright."
icon = "zap"
on_error = "continue"

[meta]
author = "Omarchist"

[[step]]
type = "if"
check = "on_battery"

[[step.then]]
type = "action"
action = "power.profile"
profile = "power-saver"

[[step.then]]
type = "action"
action = "brightness.set"
level = 40

[[step.otherwise]]
type = "action"
action = "power.profile"
profile = "balanced"

[[step.otherwise]]
type = "action"
action = "brightness.set"
level = 80
