# This is an Omarchist flow: https://omarchist.com/flows/

format = 2
name = "Wind down"
description = "Night light on, a dimmer screen, and quieter sound for the evening."
icon = "moon"
on_error = "continue"

[meta]
author = "Omarchist"

[[step]]
type = "action"
action = "nightlight.set"
state = "on"

[[step]]
type = "action"
action = "brightness.set"
level = 30

[[step]]
type = "action"
action = "volume.set"
level = 20

[[step]]
type = "notify"
title = "Wind down"
body = "Time to wrap up for the day"
